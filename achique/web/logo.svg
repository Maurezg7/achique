<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="Achique">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14382a"/><stop offset="1" stop-color="#06120d"/>
    </linearGradient>
    <linearGradient id="rj" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5d6c"/><stop offset="1" stop-color="#e2141f"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#2fd08a" stroke-opacity=".55" stroke-width="8"/>
  <!-- arco (palos y travesaño) -->
  <path d="M96 400 V150 H416 V400" fill="none" stroke="#2fd08a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".9"/>
  <!-- la A: el ángulo que se achica -->
  <path d="M150 420 L256 108 L362 420" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- barrera roja: el bloqueo -->
  <rect x="132" y="292" width="248" height="44" rx="22" fill="url(#rj)"/>
  <!-- señal pirata frenada -->
  <path d="M232 380 L232 440 L284 410 Z" fill="#ff5d6c"/>
</svg>
